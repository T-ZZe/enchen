name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile
        run: |
          POM=$(find . -name pom.xml -not -path "*/target/*" | head -n 1)
          echo "pom.xml trouvé : $POM"
          mvn -B -f "$POM" package
      - uses: actions/upload-artifact@v4
        with:
          name: EnchantLimit
          path: "**/target/EnchantLimit.jar"
